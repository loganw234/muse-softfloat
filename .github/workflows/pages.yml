name: Deploy demo site to GitHub Pages

# Publishes site/ as the Pages artifact. The site is fully static and
# pre-built in the repository (site/build.py regenerates it); this
# workflow only uploads what is committed. Pages itself must be
# enabled once by the repository owner: Settings -> Pages ->
# Source: GitHub Actions. Until then this workflow's deploy step has
# nowhere to publish.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
